<?xml version='1.0' encoding='utf-8'?>
<mameconfig version="10">
    <system name="default">

        <!-- All controllers input configuration file -->

        <input>
            <!-- Trooper V2 = 0300a319242e00006a38000010010000 -->
            <mapdevice device="0300a319242e00006a38000010010000" controller="JOYCODE_1" />
            <!-- Xinmo 1 & 2 = 0300d582c0160000e105000010010000 (use for both players) -->
            <mapdevice device="0300d582c0160000e105000010010000" controller="JOYCODE_2" />
            <mapdevice device="0300d582c0160000e105000010010000" controller="JOYCODE_3" />
            <!-- Ultra-Stik = 0300c41c09d200001105000011010000 -->
            <mapdevice device="0300c41c09d200001105000011010000" controller="JOYCODE_4" />
            <!-- Mario Kart = 030086650d0f00003e01000015010000 -->
            <mapdevice device="030086650d0f00003e01000015010000" controller="JOYCODE_5" />
            <!-- iCode HuiJia = 030083a08f0e00001330000011010000 (iCode setup: Port 1 Only) -->
            <mapdevice device="030083a08f0e00001330000011010000" controller="JOYCODE_6" />

            <port type="P1_JOYSTICK_UP">
                <newseq type="standard">
                    KEYCODE_UP OR JOYCODE_1_YAXIS_UP_SWITCH OR JOYCODE_2_YAXIS_UP_SWITCH OR JOYCODE_4_YAXIS_UP_SWITCH OR JOYCODE_5_HAT1UP
                </newseq>
            </port>
            <port type="P1_JOYSTICK_DOWN">
                <newseq type="standard">
                    KEYCODE_DOWN OR JOYCODE_1_YAXIS_DOWN_SWITCH OR JOYCODE_2_YAXIS_DOWN_SWITCH OR JOYCODE_4_YAXIS_DOWN_SWITCH OR JOYCODE_5_HAT1DOWN
                </newseq>
            </port>
            <port type="P1_JOYSTICK_LEFT">
