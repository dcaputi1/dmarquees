                    KEYCODE_LEFT OR JOYCODE_1_XAXIS_LEFT_SWITCH OR JOYCODE_2_XAXIS_LEFT_SWITCH OR JOYCODE_4_XAXIS_LEFT_SWITCH OR JOYCODE_5_HAT1LEFT
                </newseq>
            </port>
            <port type="P1_JOYSTICK_RIGHT">
                <newseq type="standard">
                    KEYCODE_RIGHT OR JOYCODE_1_XAXIS_RIGHT_SWITCH OR JOYCODE_2_XAXIS_RIGHT_SWITCH OR JOYCODE_4_XAXIS_RIGHT_SWITCH OR JOYCODE_5_HAT1RIGHT
                </newseq>
            </port>
            <port type="P1_BUTTON1">
                <newseq type="standard">
                    JOYCODE_1_BUTTON1 OR JOYCODE_2_BUTTON2 OR JOYCODE_5_BUTTON1 OR JOYCODE_4_BUTTON1 OR JOYCODE_6_BUTTON1
