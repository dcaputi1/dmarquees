<?xml version="1.0"?>
<mameconfig version="10">
	<system name="default">

		<!-- DC Panel 1 input configuration file -->
        <!-- Used to demonstrate spinner configuration for Pong, etc. by disabling the iCode Paddles -->
        <!-- Note, DCPanel spinners conflict with the iCode Paddles when both are mapped -->

		<input>
			<!-- Trooper V2 = 0300a319242e00006a38000010010000 -->
			<mapdevice device="0300a319242e00006a38000010010000" controller="JOYCODE_1" />
			<!-- Xinmo 1 & 2 = 0300d582c0160000e105000010010000 (use for both players) -->
            <mapdevice device="0300d582c0160000e105000010010000" controller="JOYCODE_7" />
            <mapdevice device="0300d582c0160000e105000010010000" controller="JOYCODE_8" />
			<!-- Ultra-Stik = 0300c41c09d200001105000011010000 -->
			<mapdevice device="0300c41c09d200001105000011010000" controller="JOYCODE_4" />
			<!-- Mario Kart = 030086650d0f00003e01000015010000 -->
            <mapdevice device="030086650d0f00003e01000015010000" controller="JOYCODE_9" />
			<!-- iCode HuiJia = 030083a08f0e00001330000011010000 (iCode setup: Port 1 Only) -->
            <mapdevice device="030083a08f0e00001330000011010000" controller="JOYCODE_10" />

            <port type="P1_JOYSTICK_UP">
                <newseq type="standard">
                    KEYCODE_UP OR JOYCODE_1_YAXIS_UP_SWITCH OR JOYCODE_4_YAXIS_UP_SWITCH
                </newseq>
            </port>
            <port type="P1_JOYSTICK_DOWN">
                <newseq type="standard">
                    KEYCODE_DOWN OR JOYCODE_1_YAXIS_DOWN_SWITCH OR JOYCODE_4_YAXIS_DOWN_SWITCH
                </newseq>
            </port>
            <port type="P1_JOYSTICK_LEFT">
                <newseq type="standard">
                    KEYCODE_LEFT OR JOYCODE_1_XAXIS_LEFT_SWITCH OR JOYCODE_4_XAXIS_LEFT_SWITCH
                </newseq>
            </port>
            <port type="P1_JOYSTICK_RIGHT">
                <newseq type="standard">
                    KEYCODE_RIGHT OR JOYCODE_1_XAXIS_RIGHT_SWITCH OR JOYCODE_4_XAXIS_RIGHT_SWITCH
                </newseq>
            </port>
            <port type="P1_BUTTON1">
                <newseq type="standard">
                    JOYCODE_1_BUTTON1 OR JOYCODE_4_BUTTON1
                </newseq>
            </port>
            <port type="P1_BUTTON2">
                <newseq type="standard">
                    JOYCODE_1_BUTTON2 OR JOYCODE_4_BUTTON2
                </newseq>
            </port>
            <port type="P1_BUTTON3">
                <newseq type="standard">
                    JOYCODE_4_BUTTON3
                </newseq>
            </port>
            <port type="P1_BUTTON4">
                <newseq type="standard">
                    JOYCODE_4_BUTTON4
                </newseq>
            </port>
            <port type="P1_BUTTON5">
                <newseq type="standard">
                    JOYCODE_1_BUTTON3 OR JOYCODE_4_BUTTON10
                </newseq>
            </port>
            <port type="P1_BUTTON6">
                <newseq type="standard">
                    JOYCODE_1_BUTTON4 OR JOYCODE_4_BUTTON11
                </newseq>
            </port>
            <port type="P1_START">
                <newseq type="standard">
                    KEYCODE_1 OR JOYCODE_1_BUTTON6 OR JOYCODE_4_BUTTON7
                </newseq>
            </port>
            <port type="P1_SELECT">
                <newseq type="standard">
                    KEYCODE_5 OR JOYCODE_1_BUTTON5 OR JOYCODE_4_BUTTON6
                </newseq>
            </port>
            <port type="P2_START">
                <newseq type="standard">
                    KEYCODE_2 OR JOYCODE_4_BUTTON8
                </newseq>
            </port>
            <port type="P2_SELECT">
                <newseq type="standard">
                    KEYCODE_6
                </newseq>
            </port>
            <port type="START1">
                <newseq type="standard">
                    KEYCODE_1 OR JOYCODE_1_BUTTON6 OR JOYCODE_4_BUTTON7
                </newseq>
            </port>
            <port type="START2">
                <newseq type="standard">
                    KEYCODE_2 OR JOYCODE_4_BUTTON8
                </newseq>
            </port>
            <port type="COIN1">
                <newseq type="standard">
                    KEYCODE_5 OR JOYCODE_1_BUTTON5 OR JOYCODE_4_BUTTON6
                </newseq>
            </port>
            <port type="COIN2">
                <newseq type="standard">
                    KEYCODE_6
                </newseq>
            </port>
            <port type="P1_PADDLE">
                <newseq type="standard">
                    MOUSECODE_1_XAXIS
                </newseq>
            </port>
            <port type="P2_PADDLE">
                <newseq type="standard">
                    MOUSECODE_1_YAXIS
                </newseq>
            </port>
            <port type="P1_PADDLE_V">
                <newseq type="standard">
                    MOUSECODE_1_YAXIS
                </newseq>
            </port>
            <port type="UI_SELECT">
                <newseq type="standard">
                    KEYCODE_ENTER
                </newseq>
            </port>
            <port type="UI_BACK">
                <newseq type="standard">
                    KEYCODE_BACKSPACE
                </newseq>
            </port>
            <port type="UI_CANCEL">
                <newseq type="standard">
                    KEYCODE_ESC
                </newseq>
            </port>
            <port type="UI_CLEAR">
                <newseq type="standard">
                    KEYCODE_DEL
                </newseq>
            </port>
            <port type="UI_HELP">
                <newseq type="standard">
                    KEYCODE_F1
                </newseq>
            </port>
		</input>
	</system>
    <system name="astdelux">
        <input>
            <port tag=":IN0" type="P1_BUTTON5" mask="8" defvalue="0">
                <newseq type="standard">
                    JOYCODE_1_BUTTON3 OR JOYCODE_1_BUTTON4 OR JOYCODE_4_BUTTON3
                </newseq>
            </port>
            <port tag=":IN0" type="P1_BUTTON3" mask="16" defvalue="0">
                <newseq type="standard">
                    KEYCODE_LCONTROL OR JOYCODE_1_BUTTON1 OR JOYCODE_4_BUTTON5
                </newseq>
            </port>
            <port tag=":IN1" type="P1_BUTTON4" mask="32" defvalue="0">
                <newseq type="standard">
                    JOYCODE_1_YAXIS_UP_SWITCH OR JOYCODE_1_BUTTON2 OR JOYCODE_4_YAXIS_UP_SWITCH OR JOYCODE_4_BUTTON4
                </newseq>
            </port>
            <port tag=":IN1" type="P1_BUTTON2" mask="64" defvalue="0">
                <newseq type="standard">
                    KEYCODE_RIGHT OR JOYCODE_1_XAXIS_RIGHT_SWITCH OR JOYCODE_4_XAXIS_RIGHT_SWITCH OR JOYCODE_4_BUTTON2
                </newseq>
            </port>
            <port tag=":IN1" type="P1_BUTTON1" mask="128" defvalue="0">
                <newseq type="standard">
                    KEYCODE_LEFT OR JOYCODE_1_XAXIS_LEFT_SWITCH OR JOYCODE_4_XAXIS_LEFT_SWITCH OR JOYCODE_4_BUTTON1
                </newseq>
            </port>
        </input>
    </system>
    <system name="asteroid">
        <input>
            <port tag=":IN0" type="P1_BUTTON5" mask="8" defvalue="0">
                <newseq type="standard">
                    JOYCODE_1_BUTTON3 OR JOYCODE_1_BUTTON4 OR JOYCODE_4_BUTTON3
                </newseq>
            </port>
            <port tag=":IN0" type="P1_BUTTON3" mask="16" defvalue="0">
                <newseq type="standard">
                    JOYCODE_1_BUTTON1 OR JOYCODE_4_BUTTON5
                </newseq>
            </port>
            <port tag=":IN1" type="P1_BUTTON4" mask="32" defvalue="0">
                <newseq type="standard">
                    JOYCODE_1_BUTTON2 OR JOYCODE_1_YAXIS_UP_SWITCH OR JOYCODE_4_YAXIS_UP_SWITCH OR JOYCODE_4_BUTTON4
                </newseq>
            </port>
            <port tag=":IN1" type="P1_BUTTON2" mask="64" defvalue="0">
                <newseq type="standard">
                    KEYCODE_RIGHT OR JOYCODE_1_XAXIS_RIGHT_SWITCH OR JOYCODE_4_XAXIS_RIGHT_SWITCH OR JOYCODE_4_BUTTON2
                </newseq>
            </port>
            <port tag=":IN1" type="P1_BUTTON1" mask="128" defvalue="0">
                <newseq type="standard">
                    KEYCODE_LEFT OR JOYCODE_1_XAXIS_LEFT_SWITCH OR JOYCODE_4_XAXIS_LEFT_SWITCH OR JOYCODE_4_BUTTON1
                </newseq>
            </port>
        </input>
    </system>
    <system name="atetris">
        <input>
            <port tag=":IN1" type="P1_BUTTON1" mask="1" defvalue="0">
                <newseq type="standard">
                    JOYCODE_1_BUTTON1 OR JOYCODE_4_BUTTON1 OR JOYCODE_1_BUTTON6 OR JOYCODE_4_BUTTON7
                </newseq>
            </port>
            <port tag=":IN1" type="P2_BUTTON1" mask="16" defvalue="0">
                <newseq type="standard">
                    KEYCODE_A
                </newseq>
            </port>
        </input>
    </system>
    <system name="berzerk">
        <input>
            <port tag=":P1" type="P1_BUTTON1" mask="16" defvalue="16">
                <newseq type="standard">
                    JOYCODE_1_BUTTON1 OR JOYCODE_4_BUTTON1 OR JOYCODE_4_BUTTON2 OR JOYCODE_4_BUTTON3
                </newseq>
            </port>
            <port tag=":P2" type="P2_BUTTON1" mask="16" defvalue="16">
                <newseq type="standard">
                    
                </newseq>
            </port>
        </input>
    </system>
    <system name="breakout">
        <input>
            <port tag=":DIPS" type="DIPSWITCH" mask="4" defvalue="0" value="4" />
            <port tag=":IN0" type="P1_BUTTON1" mask="16" defvalue="0">
                <newseq type="standard">
                    JOYCODE_1_BUTTON1 OR JOYCODE_4_BUTTON1
                </newseq>
            </port>
        </input>
    </system>
    <system name="defender">
        <input>
            <port tag=":IN0" type="P1_BUTTON1" mask="1" defvalue="0">
                <newseq type="standard">
                    JOYCODE_1_BUTTON1 OR JOYCODE_4_BUTTON3
                </newseq>
            </port>
            <port tag=":IN0" type="P1_BUTTON3" mask="4" defvalue="0">
                <newseq type="standard">
                    JOYCODE_1_BUTTON2 OR JOYCODE_4_BUTTON4
                </newseq>
            </port>
            <port tag=":IN0" type="P1_BUTTON4" mask="8" defvalue="0">
                <newseq type="standard">
                    JOYCODE_1_BUTTON3 OR JOYCODE_1_BUTTON4 OR JOYCODE_4_BUTTON2
                </newseq>
            </port>
        </input>
    </system>
    <system name="dkong">
        <input>
            <port tag=":IN0" type="P1_BUTTON1" mask="16" defvalue="0">
                <newseq type="standard">
                    JOYCODE_1_BUTTON1 OR JOYCODE_4_BUTTON1 OR JOYCODE_4_BUTTON3
                </newseq>
            </port>
            <port tag=":IN1" type="P2_BUTTON1" mask="16" defvalue="0">
                <newseq type="standard">
                    JOYCODE_1_BUTTON1 OR JOYCODE_4_BUTTON1 OR JOYCODE_4_BUTTON3
                </newseq>
            </port>
        </input>
    </system>
    <system name="dkongjr">
        <input>
            <port tag=":IN0" type="P1_BUTTON1" mask="16" defvalue="0">
                <newseq type="standard">
                    JOYCODE_1_BUTTON1 OR JOYCODE_4_BUTTON1 OR JOYCODE_4_BUTTON3
                </newseq>
            </port>
            <port tag=":IN1" type="P2_BUTTON1" mask="16" defvalue="0">
                <newseq type="standard">
                    JOYCODE_1_BUTTON1 OR JOYCODE_4_BUTTON1 OR JOYCODE_4_BUTTON3
                </newseq>
            </port>
        </input>
    </system>
    <system name="indytemp">
        <input>
            <port tag=":F60000" type="P1_BUTTON1" mask="1" defvalue="1">
                <newseq type="standard">
                    JOYCODE_1_BUTTON1 OR JOYCODE_1_BUTTON6 OR JOYCODE_4_BUTTON1 OR JOYCODE_4_BUTTON7
                </newseq>
            </port>
            <port tag=":F60000" type="START2" mask="2" defvalue="2">
                <newseq type="standard">
                    JOYCODE_1_BUTTON2 OR JOYCODE_4_BUTTON3 OR JOYCODE_4_BUTTON8
                </newseq>
            </port>
            <port tag=":IN0" type="P1_JOYSTICK_UP" mask="16" defvalue="0">
                <newseq type="standard">
                    JOYCODE_1_YAXIS_UP_SWITCH OR JOYCODE_4_YAXIS_UP_SWITCH
                </newseq>
            </port>
            <port tag=":IN0" type="P1_JOYSTICK_DOWN" mask="32" defvalue="0">
                <newseq type="standard">
                    JOYCODE_1_YAXIS_DOWN_SWITCH OR JOYCODE_4_YAXIS_DOWN_SWITCH
                </newseq>
            </port>
            <port tag=":IN0" type="P1_JOYSTICK_LEFT" mask="64" defvalue="0">
                <newseq type="standard">
                    JOYCODE_1_XAXIS_LEFT_SWITCH OR JOYCODE_4_XAXIS_LEFT_SWITCH
                </newseq>
            </port>
            <port tag=":IN0" type="P1_JOYSTICK_RIGHT" mask="128" defvalue="0">
                <newseq type="standard">
                    JOYCODE_1_XAXIS_RIGHT_SWITCH OR JOYCODE_4_XAXIS_RIGHT_SWITCH
                </newseq>
            </port>
        </input>
    </system>
    <system name="mhavoc">
        <input>
            <port tag=":DIAL" type="P1_DIAL" mask="255" defvalue="0" keydelta="100" />
            <port tag=":IN1" type="P1_BUTTON2" mask="64" defvalue="64">
                <newseq type="standard">
                    JOYCODE_1_BUTTON2 OR JOYCODE_4_BUTTON2 OR JOYCODE_4_BUTTON8
                </newseq>
            </port>
            <port tag=":IN1" type="P1_BUTTON1" mask="128" defvalue="128">
                <newseq type="standard">
                    JOYCODE_1_BUTTON1 OR JOYCODE_4_BUTTON1 OR JOYCODE_1_BUTTON6 OR JOYCODE_4_BUTTON7
                </newseq>
            </port>
        </input>
    </system>
    <system name="pong">
        <input>
            <port tag=":PADDLE0" type="P1_PADDLE" mask="255" defvalue="0" sensitivity="32" />
            <port tag=":PADDLE1" type="P2_PADDLE" mask="255" defvalue="0" sensitivity="32" />
        </input>
    </system>
    <system name="punchout">
        <input>
            <port tag=":IN0" type="P1_BUTTON1" mask="1" defvalue="0">
                <newseq type="standard">
                    JOYCODE_1_BUTTON1 OR JOYCODE_4_BUTTON1 OR JOYCODE_4_BUTTON3 OR JOYCODE_4_BUTTON7
                </newseq>
            </port>
            <port tag=":IN0" type="P1_BUTTON2" mask="4" defvalue="0">
                <newseq type="standard">
                    JOYCODE_1_BUTTON2 OR JOYCODE_4_BUTTON2 OR JOYCODE_4_BUTTON4
                </newseq>
            </port>
            <port tag=":IN0" type="P1_BUTTON3" mask="8" defvalue="0">
                <newseq type="standard">
                    JOYCODE_1_BUTTON3 OR JOYCODE_4_BUTTON5
                </newseq>
            </port>
        </input>
    </system>
    <system name="sbrkout">
        <input>
            <port tag=":PADDLE" type="P1_PADDLE" mask="255" defvalue="0" sensitivity="75">
                <newseq type="standard">
                    MOUSECODE_1_XAXIS OR JOYCODE_1_XAXIS OR MOUSECODE_1_YAXIS
                </newseq>
            </port>
        </input>
    </system>
    <system name="spnchout">
        <input>
            <port tag=":IN0" type="P1_BUTTON1" mask="1" defvalue="0">
                <newseq type="standard">
                    JOYCODE_1_BUTTON1 OR JOYCODE_4_BUTTON3
                </newseq>
            </port>
            <port tag=":IN0" type="P1_BUTTON2" mask="4" defvalue="0">
                <newseq type="standard">
                    JOYCODE_1_BUTTON2 OR JOYCODE_4_BUTTON4
                </newseq>
            </port>
            <port tag=":IN0" type="P1_BUTTON3" mask="8" defvalue="0">
                <newseq type="standard">
                    JOYCODE_1_BUTTON3 OR JOYCODE_4_BUTTON5
                </newseq>
            </port>
            <port tag=":IN0" type="P1_BUTTON4" mask="64" defvalue="64">
                <newseq type="standard">
                    JOYCODE_1_BUTTON4 OR JOYCODE_4_BUTTON2
                </newseq>
            </port>
        </input>
    </system>
    <system name="stargate">
        <input>
            <port tag=":IN0" type="P1_BUTTON1" mask="1" defvalue="0">
                <newseq type="standard">
                    JOYCODE_1_BUTTON1 OR JOYCODE_4_BUTTON3
                </newseq>
            </port>
            <port tag=":IN0" type="P1_BUTTON3" mask="4" defvalue="0">
                <newseq type="standard">
                    JOYCODE_1_BUTTON2 OR JOYCODE_4_BUTTON4
                </newseq>
            </port>
            <port tag=":IN0" type="P1_BUTTON6" mask="8" defvalue="0">
                <newseq type="standard">
                    JOYCODE_1_BUTTON3
                </newseq>
            </port>
            <port tag=":IN1" type="P1_BUTTON5" mask="2" defvalue="0">
                <newseq type="standard">
                    JOYCODE_1_BUTTON4 OR JOYCODE_4_BUTTON1
                </newseq>
            </port>
        </input>
    </system>
    <system name="superbug">
        <input>
            <port tag=":STEER_1" type="P1_DIAL" mask="255" defvalue="0">
                <newseq type="standard">
                    MOUSECODE_1_XAXIS OR JOYCODE_1_XAXIS OR MOUSECODE_1_YAXIS
                </newseq>
            </port>
        </input>
    </system>
    <system name="tempest">
        <input>
            <port tag=":KNOBP1" type="P1_DIAL" mask="15" defvalue="0">
                <newseq type="standard">
                    MOUSECODE_1_XAXIS OR MOUSECODE_1_YAXIS
                </newseq>
            </port>
            <port tag=":KNOBP2" type="P2_DIAL" mask="15" defvalue="0">
                <newseq type="standard">
                    MOUSECODE_1_XAXIS OR MOUSECODE_1_YAXIS
                </newseq>
            </port>
        </input>
    </system>

</mameconfig>
